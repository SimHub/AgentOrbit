name: CI (v2 Cross-Platform)

on:
  push:
    branches: [v2-rust-tauri, main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'src-tauri/**'
      - 'ui/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    branches: [v2-rust-tauri, main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'src-tauri/**'
      - 'ui/**'
      - '.github/workflows/v2-ci.yml'

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Tauri v2 system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Run Rust workspace unit tests
        run: cargo test --workspace

      - name: Build release binaries (CLI/TUI + Desktop HUD)
        run: cargo build --release --workspace
