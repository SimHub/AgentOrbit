name: Release v2 (Cross-Platform Portable)

on:
  push:
    tags:
      - 'v2*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0-alpha.1'

permissions:
  contents: write

jobs:
  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: agentorbit-macos-arm64
            ext: tar.gz
          - os: ubuntu-latest
            artifact: agentorbit-linux-x86_64
            ext: tar.gz
          - os: windows-latest
            artifact: agentorbit-windows-x86_64
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Tauri v2 system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Run unit tests
        run: cargo test --workspace

      - name: Build release binaries (unsigned, zero node_modules)
        run: cargo build --release --workspace

      - name: Package portable archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/pkg
          cp target/release/agentorbit dist/pkg/agentorbit
          cp target/release/agentorbit-app dist/pkg/agentorbit-app
          cp scripts/install-portable.sh dist/pkg/install-portable.sh
          chmod +x dist/pkg/install-portable.sh
          cp src-tauri/icons/icon.png dist/pkg/icon.png
          cp src-tauri/icons/icon.icns dist/pkg/icon.icns
          cp LICENSE README.md dist/pkg/
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C dist/pkg .
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "dist/${{ matrix.artifact }}.tar.gz" > "dist/${{ matrix.artifact }}.tar.gz.sha256"
          else
            sha256sum "dist/${{ matrix.artifact }}.tar.gz" > "dist/${{ matrix.artifact }}.tar.gz.sha256"
          fi

      - name: Package portable archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\pkg | Out-Null
          Copy-Item target\release\agentorbit.exe dist\pkg\agentorbit.exe
          Copy-Item target\release\agentorbit-app.exe dist\pkg\agentorbit-app.exe
          Copy-Item scripts\install-shortcut.ps1 dist\pkg\install-shortcut.ps1
          Copy-Item src-tauri\icons\icon.ico dist\pkg\icon.ico
          Copy-Item LICENSE, README.md dist\pkg\
          Compress-Archive -Path dist\pkg\* -DestinationPath "dist\${{ matrix.artifact }}.zip" -Force
          $hash = (Get-FileHash "dist\${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii "dist\${{ matrix.artifact }}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.${{ matrix.ext }}
            dist/${{ matrix.artifact }}.${{ matrix.ext }}.sha256

  publish-release:
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: release-files/*
          generate_release_notes: true
