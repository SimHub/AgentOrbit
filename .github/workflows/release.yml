name: Release DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'App version without leading v (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: ./scripts/run_tests.sh

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build universal app and DMG
        env:
          AGENTORBIT_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ./scripts/build_app.sh --universal --dmg
          shasum -a 256 dist/AgentOrbit.dmg | tee dist/AgentOrbit.dmg.sha256

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AgentOrbit.dmg
            dist/AgentOrbit.dmg.sha256
          generate_release_notes: true
