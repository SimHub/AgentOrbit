name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CONTEXT.md'
      - 'LICENSE'
      - 'docs/**'
      - '.github/FUNDING.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CONTEXT.md'
      - 'LICENSE'
      - 'docs/**'
      - '.github/FUNDING.yml'

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: ./scripts/run_tests.sh

      - name: Build single-arch app bundle
        run: ./scripts/build_app.sh
